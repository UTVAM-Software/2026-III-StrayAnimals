<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<rect width="1200" height="760" fill="white"/>
<text x="600" y="35" font-family="Arial" font-size="25" text-anchor="middle" fill="#1f2937">Stray Animals — Modelo Lógico</text>
<g font-family="Arial" font-size="15" fill="#111827" stroke="#475569" stroke-width="1.5">
<rect x="35" y="80" width="260" height="150" fill="#f8fafc"/><rect x="35" y="80" width="260" height="35" fill="#dbeafe"/><text x="165" y="103" text-anchor="middle" stroke="none" font-weight="bold">ROL</text><text x="50" y="140" stroke="none">PK id</text><text x="50" y="165" stroke="none">nombre_rol VARCHAR(30) UNIQUE</text>
<rect x="350" y="80" width="350" height="220" fill="#f8fafc"/><rect x="350" y="80" width="350" height="35" fill="#dbeafe"/><text x="525" y="103" text-anchor="middle" stroke="none" font-weight="bold">PERFIL_USUARIO</text><text x="365" y="140" stroke="none">PK id</text><text x="365" y="165" stroke="none">FK usuario_id → auth_user.id (UNIQUE)</text><text x="365" y="190" stroke="none">nombre VARCHAR(100)</text><text x="365" y="215" stroke="none">correo VARCHAR(150) UNIQUE</text><text x="365" y="240" stroke="none">FK rol_id → rol.id</text>
<rect x="35" y="360" width="340" height="260" fill="#f8fafc"/><rect x="35" y="360" width="340" height="35" fill="#dbeafe"/><text x="205" y="383" text-anchor="middle" stroke="none" font-weight="bold">REPORTE</text><text x="50" y="420" stroke="none">PK id</text><text x="50" y="445" stroke="none">FK usuario_id → perfil_usuario.id</text><text x="50" y="470" stroke="none">descripcion TEXT</text><text x="50" y="495" stroke="none">fotografia IMAGE NULL</text><text x="50" y="520" stroke="none">ubicacion VARCHAR(255)</text><text x="50" y="545" stroke="none">prioridad: Baja/Media/Alta</text><text x="50" y="570" stroke="none">estatus: Reportado/Rescatado/</text><text x="50" y="592" stroke="none">Temporal/Adoptado; fecha_creacion</text>
<rect x="430" y="360" width="330" height="190" fill="#f8fafc"/><rect x="430" y="360" width="330" height="35" fill="#dbeafe"/><text x="595" y="383" text-anchor="middle" stroke="none" font-weight="bold">HOGAR_TEMPORAL</text><text x="445" y="420" stroke="none">PK id</text><text x="445" y="445" stroke="none">FK usuario_id → perfil_usuario.id</text><text x="445" y="470" stroke="none">capacidad INT (&gt; 0)</text><text x="445" y="495" stroke="none">disponibilidad BOOLEAN</text>
<rect x="810" y="360" width="350" height="220" fill="#f8fafc"/><rect x="810" y="360" width="350" height="35" fill="#dbeafe"/><text x="985" y="383" text-anchor="middle" stroke="none" font-weight="bold">SOLICITUD_ADOPCION</text><text x="825" y="420" stroke="none">PK id</text><text x="825" y="445" stroke="none">FK reporte_id → reporte.id</text><text x="825" y="470" stroke="none">FK usuario_interesado_id → perfil_usuario.id</text><text x="825" y="495" stroke="none">estado: Pendiente/Aprobada/Rechazada</text><text x="825" y="520" stroke="none">fecha_solicitud DATETIME</text>
</g>
<g stroke="#64748b" stroke-width="2" fill="none"><path d="M295 155 H350"/><path d="M525 300 V330 H205 V360"/><path d="M525 300 V335 H595 V360"/><path d="M525 300 V325 H985 V360"/><path d="M375 465 H810"/></g>
<g font-family="Arial" font-size="14" fill="#334155"><text x="310" y="145">1:N</text><text x="255" y="322">1:N</text><text x="605" y="322">1:N</text><text x="750" y="322">1:N</text><text x="590" y="453">1:N</text></g>
<text x="600" y="700" font-family="Arial" font-size="14" text-anchor="middle" fill="#475569">Las PK y FK son administradas por Django ORM. auth_user corresponde al usuario integrado de Django.</text>
</svg>
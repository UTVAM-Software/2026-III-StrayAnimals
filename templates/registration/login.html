<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | Stray Animals</title><style>body{font-family:Arial;background:#eef2f7;display:grid;place-items:center;min-height:100vh;margin:0}.box{background:#fff;padding:32px;border-radius:10px;box-shadow:0 8px 25px #0002;width:min(420px,90%)}input{width:100%;padding:10px;box-sizing:border-box}button{padding:10px 16px;background:#2563eb;color:#fff;border:0;border-radius:5px}</style></head>
<body><section class="box"><h1>Stray Animals</h1><h2>Iniciar sesión</h2>{% if form.errors %}<p>Usuario o contraseña incorrectos.</p>{% endif %}<form method="post">{% csrf_token %}{{ form.as_p }}{% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}<button type="submit">Iniciar sesión</button></form></section></body></html>
